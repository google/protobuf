name: Rust Tests

on:
  workflow_call:
    inputs:
      continuous-run:
        required: false
        default: ""
        description: "Boolean string denoting whether this run is continuous --
          empty string for presubmit, non-empty string for continuous."
        type: string
      safe-checkout:
        required: true
        description: "The SHA key for the commit we want to run over"
        type: string

permissions:
  contents: read

jobs:
  # This job should be run on presubmit, if any continuous-only tests are added we will need to input test-type above
  linux:
    strategy:
      fail-fast: false   # Don't cancel all jobs if one fails.
      matrix:
        # Runs on both profiles of the composite Linux image (`latest`: Clang 23 /
        # Bazel 9.2.0, `floor`: Clang 14 / Bazel 8.7.0). Bazel targets use
        # hermetic `@rules_rust` toolchains; the standalone `Cargo` row installs
        # live Rust `stable` on `latest` and `rust-toolchain.toml`'s `1.90.0` plus
        # a `1.82.0` MSRV `cargo check` pass on `floor` via `rustup`.
        profile: [latest, floor]
        config:
          - { name: "Bzlmod and Workspace", flags: --enable_bzlmod --enable_workspace }
          - { name: Optimized, flags: --config=opt }
          - { name: ASAN, flags: --config=asan }
          - { name: Cargo, bazel_cmd: run, targets: "//rust/release_crates:cargo_test" }

        include:
          - targets: "//rust/... //src/google/protobuf/compiler/rust/..."
          - bazel_cmd: "test"
          # Image and Bazel version per profile (explicit USE_BAZEL_VERSION
          # overrides the repo-root `.bazeliskrc`), pinned by digest.
          - profile: latest
            bazel: "9.2.0"
            image: "us-docker.pkg.dev/protobuf-build/containers/test/linux/composite@sha256:3b4ba7714b69dfc78cb6cd1ec9c71c1a830e78248abe40a1f5c11314f6667248"
          - profile: floor
            bazel: "8.7.0"
            image: "us-docker.pkg.dev/protobuf-build/containers/test/linux/composite@sha256:e22a3b313e1ab90785c18cfd9c948d547bad1501b72a2dd68c14777cce3d30c8"

    name: Linux ${{ matrix.config.name }}${{ matrix.profile == 'floor' && ' (floor)' || '' }}
    runs-on: ubuntu-22-4core
    steps:
      - name: Checkout pending changes
        uses: protocolbuffers/protobuf-ci/checkout@v7
        with:
          ref: ${{ inputs.safe-checkout }}
      - name: Run tests
        uses: protocolbuffers/protobuf-ci/bazel-docker@v7
        with:
          image: ${{ matrix.image }}
          credentials: ${{ secrets.GAR_SERVICE_ACCOUNT }}
          bazel-cache: rust_linux
          bash: >-
            ${{ matrix.config.name == 'Cargo' && (matrix.profile == 'latest' && format('RUSTUP_TOOLCHAIN=stable CARGO_TEST_ALLOW_WARNINGS={0} ', inputs.continuous-run && '0' || '1') || 'CARGO_TEST_MSRV=1.82.0 ') || '' }}USE_BAZEL_VERSION=${{ matrix.bazel }}
            bazel ${{ matrix.config.bazel_cmd || matrix.bazel_cmd }}
            ${{ matrix.config.targets || matrix.targets }} ${{ matrix.config.flags }} $BAZEL_FLAGS

  windows:
    strategy:
      fail-fast: false   # Don't cancel all jobs if one fails.
    name: Windows Cargo
    runs-on: windows-2022
    steps:
      - name: Checkout pending changes
        uses: protocolbuffers/protobuf-ci/checkout@v7
        with:
          ref: ${{ inputs.safe-checkout }}
      - name: Windows startup flags
        shell: bash
        run: echo "startup --output_user_root=C:/ --windows_enable_symlinks" >> .bazelrc
      - name: Run tests
        uses: protocolbuffers/protobuf-ci/bazel@v7
        with:
          credentials: ${{ secrets.GAR_SERVICE_ACCOUNT }}
          bazel: run //rust/release_crates:cargo_test
          bazel-cache: windows-cargo
          version: 9.2.0
